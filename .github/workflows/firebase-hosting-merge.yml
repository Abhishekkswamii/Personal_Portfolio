# Deploys the static export to Firebase Hosting on every push to main.
# The FIREBASE_SERVICE_ACCOUNT_ABHISHEK_PORTFOLIO_2026 secret is created by
# running `firebase init hosting:github` from the repo root (see README).
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ABHISHEK_PORTFOLIO_2026 }}'
          channelId: live
          projectId: abhishek-portfolio-2026
